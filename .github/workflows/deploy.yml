name: Deploy admin dashboard

on:
  # Manual-only: deploys run ONLY when triggered by hand (Actions -> Deploy
  # admin dashboard -> Run workflow). A push never auto-deploys so a
  # compromised push cannot reach the server.
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - production
          - staging
        default: production
        required: true

# Never run two deploys of the same environment at once.
concurrency:
  group: deploy-admin-dashboard-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # Ties this run to a GitHub Environment (Settings -> Environments), which
    # is where NEXT_PUBLIC_API_URL is configured per environment (production
    # vs staging), and gives the run a clickable deployment URL in the
    # Actions UI. Served under CloudFront's existing /admin path, not a
    # separate domain -- see next.config.ts's basePath.
    environment:
      name: ${{ inputs.environment }}
      url: https://d1glhclb7uoptr.cloudfront.net/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build config
        env:
          # NEXT_PUBLIC_API_URL is inlined into the client bundle at build
          # time (see Dockerfile), so it must exist before `docker compose
          # build`, not just at container start. Not sensitive -> vars.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          umask 077
          cat > .env <<EOF
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
          EOF

      - name: Build image
        run: docker compose -f docker-compose.prod.yml build --no-cache

      - name: Start app
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Health check
        run: |
          # /admin, not /, because of next.config.ts's basePath -- the app
          # 404s at the bare root once basePath is set.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/admin || echo 000)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Admin dashboard healthy (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Admin dashboard failed health check"
          docker compose -f docker-compose.prod.yml logs --tail=80 app
          exit 1

      # No nginx step: CloudFront's /admin* origin behavior targets port 4000
      # on this box directly (per DevOps), bypassing the backend's nginx:80
      # entirely. If that changes and traffic needs to go through nginx
      # instead, a `location /admin` block has to be added to the SAME
      # server block the backend's deploy.yml writes to reverse-proxy.conf --
      # two workflows can't each own a full server block on the same host:80.

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
