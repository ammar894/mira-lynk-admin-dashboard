name: Deploy admin dashboard

on:
  # Manual-only: deploys run ONLY when triggered by hand (Actions -> Deploy
  # admin dashboard -> Run workflow). A push never auto-deploys so a
  # compromised push cannot reach the server.
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - production
          - staging
        default: production
        required: true

# Never run two deploys of the same environment at once.
concurrency:
  group: deploy-admin-dashboard-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # Ties this run to a GitHub Environment (Settings -> Environments), which
    # is where ADMIN_DASHBOARD_DOMAIN and any auth secrets below are
    # configured per environment (production vs staging), and gives the run
    # a clickable deployment URL in the Actions UI.
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.ADMIN_DASHBOARD_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build config
        env:
          # NEXT_PUBLIC_API_URL is inlined into the client bundle at build
          # time (see Dockerfile), so it must exist before `docker compose
          # build`, not just at container start. Not sensitive -> vars.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          umask 077
          cat > .env <<EOF
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
          EOF

      - name: Build image
        run: docker compose -f docker-compose.prod.yml build --no-cache

      - name: Start app
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/ || echo 000)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Admin dashboard healthy (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Admin dashboard failed health check"
          docker compose -f docker-compose.prod.yml logs --tail=80 app
          exit 1

      - name: Configure nginx reverse proxy
        env:
          ADMIN_DASHBOARD_DOMAIN: ${{ vars.ADMIN_DASHBOARD_DOMAIN }}
          # Optional: gates the whole dashboard behind HTTP basic auth in
          # front of the app's own login. Useful while the dashboard is
          # still "almost done" and shouldn't be reachable by anyone who
          # finds the domain. Leave both secrets unset to skip it.
          BASIC_AUTH_USER: ${{ secrets.ADMIN_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}
        run: |
          if [ -z "$ADMIN_DASHBOARD_DOMAIN" ]; then
            echo "vars.ADMIN_DASHBOARD_DOMAIN is not set for the '${{ inputs.environment }}' environment (Settings -> Environments)."
            exit 1
          fi

          AUTH_DIRECTIVES=""
          if [ -n "$BASIC_AUTH_USER" ] && [ -n "$BASIC_AUTH_PASSWORD" ]; then
            HASH=$(openssl passwd -apr1 "$BASIC_AUTH_PASSWORD")
            echo "${BASIC_AUTH_USER}:${HASH}" | sudo tee /etc/nginx/.admin-dashboard.htpasswd > /dev/null
            sudo chmod 640 /etc/nginx/.admin-dashboard.htpasswd
            AUTH_DIRECTIVES=$'auth_basic "Restricted";\n        auth_basic_user_file /etc/nginx/.admin-dashboard.htpasswd;'
          fi

          # Own conf.d file (not reverse-proxy.conf, which the backend's
          # deploy workflow owns) so the two deploys never clobber each
          # other's nginx config.
          sudo tee /etc/nginx/conf.d/admin-dashboard.conf > /dev/null <<NGINX
          server {
              listen 80;
              server_name ${ADMIN_DASHBOARD_DOMAIN};

              location / {
                  ${AUTH_DIRECTIVES}
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
