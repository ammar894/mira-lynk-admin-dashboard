name: miralynk-admin-prod

# Production stack for the admin dashboard: a single Next.js container.
# - Published on 0.0.0.0:4000 (not 127.0.0.1) -- CloudFront's /admin* origin
#   behavior targets this port on the box directly, per DevOps, so it must be
#   reachable from outside, not just loopback.
# - NEXT_PUBLIC_API_URL is baked in at build time (see Dockerfile), so it's
#   passed as a build arg here rather than through env_file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: miralynk-admin:latest
    container_name: miralynk-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "0.0.0.0:4000:3000"
